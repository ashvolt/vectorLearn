[project]
name = "vectorlearn"
version = "0.0.1"
description = "A course compiler: technical book in, dependency-graph course out."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.7.0", "pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vectorlearn = "vectorlearn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
